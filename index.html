<!--
  The latin faces that paint above the fold, fetched in parallel with the
  render-blocking stylesheet instead of after it — the H1 is the largest
  contentful paint and it waits on Cormorant Garamond. These are the exact URLs
  fonts.googleapis.com serves for the latin subset of the request below
  (verified against the served CSS, not guessed); if Google bumps a font
  version they go stale, which costs one wasted request and never a broken
  page. src/tests/fonts.test.ts holds the shape of them.
-->
<link
  rel="preload"
  as="font"
  type="font/woff2"
  crossorigin
  href="https://fonts.gstatic.com/s/cormorantgaramond/v21/co3bmX5slCNuHLi8bLeY9MK7whWMhyjYqXtK.woff2"
/>
<link
  rel="preload"
  as="font"
  type="font/woff2"
  crossorigin
  href="https://fonts.gstatic.com/s/cormorantgaramond/v21/co3ZmX5slCNuHLi8bLeY9MK7whWMhyjYrEtImSo.woff2"
/>
<link
  rel="preload"
  as="font"
  type="font/woff2"
  crossorigin
  href="https://fonts.gstatic.com/s/dmsans/v17/rP2Hp2ywxg089UriCZOIHQ.woff2"
/>
<!--
  Only the weights the stylesheets actually ask for: Cormorant Garamond 300 and
  400 upright with both italics (the accent spans sit inside 300-weight
  headings), DM Sans 400 and 500, Caveat 400. The axes that carried unused
  weights used to inflate this render-blocking stylesheet to 19.8 KB decoded;
  it is 11.3 KB now.
-->
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Caveat:wght@400&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap"
/>
